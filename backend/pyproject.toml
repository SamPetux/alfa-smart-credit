[project]
name = "alfa-smart-credit-backend"
version = "0.1.0"
description = "Modular monolith API and worker for Alfa Smart Credit"
requires-python = ">=3.12"
# Зафиксировано по локальной сборке 2026-10-25 (B01). Digests образов — после Compose CI (B10).
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "sqlalchemy==2.1.6",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.6",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "httpx==0.28.1",
  "ruff==0.17.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["backend*"]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
