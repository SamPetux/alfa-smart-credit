# B10: lint → unit → OpenAPI → PostgreSQL integration → frontend (если есть lock) → Compose smoke
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: alfa
          POSTGRES_PASSWORD: alfa
          POSTGRES_DB: alfa_credit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alfa -d alfa_credit_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://alfa:alfa@127.0.0.1:5432/alfa_credit_ci
      DEMO_MODE: "true"
      APP_ENV: local
      SESSION_SECRET: change-me-demo-only
      COOKIE_SECURE: "false"
      DOCUMENTS_DIR: /tmp/alfa-ci-documents
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: pip install -e "./backend[dev]"

      - name: Ruff
        run: ruff check backend/app

      - name: Unit tests
        run: pytest backend/tests/unit -q

      - name: OpenAPI contract coverage
        run: python scripts/check_openapi_contract.py

      - name: Integration tests (PostgreSQL)
        run: pytest backend/tests/integration -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Frontend scaffold gate
        run: |
          if [ ! -f frontend/package-lock.json ] && [ ! -f frontend/pnpm-lock.yaml ] && [ ! -f frontend/yarn.lock ]; then
            echo "Frontend lock отсутствует — UI ещё scaffold (владелец Игорь). Job pass с пометкой skip-build."
            exit 0
          fi
          cd frontend
          corepack enable || true
          if [ -f package-lock.json ]; then npm ci; elif [ -f pnpm-lock.yaml ]; then pnpm i --frozen-lockfile; else yarn install --frozen-lockfile; fi
          npm run typecheck
          npm run build
          if npm run | grep -q " test"; then npm test --if-present; fi

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Compose up
        run: docker compose up --build -d

      - name: Wait for ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health/ready | grep -q '"status":"ok"'; then
              echo ready
              exit 0
            fi
            sleep 2
          done
          docker compose ps -a
          docker compose logs --tail 100
          exit 1

      - name: Smoke same-origin
        run: sh infra/scripts/smoke-origin.sh

      - name: Compose down
        if: always()
        run: docker compose down -v
