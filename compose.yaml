# Compose: db → init (migrate+seed) → api/worker → web → proxy :8080
# Образы pinned по major.minor; digests — после первой успешной сборки на CI (B10).

services:
  db:
    image: postgres:16.6
    environment:
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: alfa
      POSTGRES_DB: alfa_credit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa -d alfa_credit"]
      interval: 5s
      timeout: 5s
      retries: 10
    # БД наружу не публикуем

  init:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://alfa:alfa@db:5432/alfa_credit
      DEMO_MODE: "true"
      APP_ENV: local
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/app/infra/scripts/init-db.sh"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://alfa:alfa@db:5432/alfa_credit
      DEMO_MODE: "true"
      APP_ENV: local
      SESSION_SECRET: change-me-demo-only
      COOKIE_SECURE: "false"
    depends_on:
      init:
        condition: service_completed_successfully
    # Порт наружу только через proxy

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    command: ["python", "-m", "backend.app.jobs.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://alfa:alfa@db:5432/alfa_credit
      DEMO_MODE: "true"
      APP_ENV: local
    depends_on:
      init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    depends_on:
      - api

  proxy:
    image: caddy:2.8.4
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api

volumes:
  pgdata:
