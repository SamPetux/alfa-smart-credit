# Compose: db → init (migrate+seed) → api/worker → web → proxy :8080
# Один origin UI+API. БД наружу не публикуется. Volumes: pgdata, documents.
# Digests зафиксированы после compose smoke на macOS arm64 (2026-10-26, SPA web-сборка).
# Node digests — infra/Dockerfile.web; таблица — docs/release.md.
# linux/amd64 в CI может резолвить тот же manifest list; при расхождении обновить docs/release.md.

services:
  db:
    image: postgres:16.6@sha256:557fea37a744d5f4c8faab304b0a90858b53ab119735a88c131fd19dab802f36
    environment:
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: alfa
      POSTGRES_DB: alfa_credit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa -d alfa_credit"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    # БД наружу не публикуем

  init:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://alfa:alfa@db:5432/alfa_credit
      DEMO_MODE: "true"
      APP_ENV: local
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/app/infra/scripts/init-db.sh"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://alfa:alfa@db:5432/alfa_credit
      DEMO_MODE: "true"
      APP_ENV: local
      SESSION_SECRET: change-me-demo-only
      COOKIE_SECURE: "false"
      DOCUMENTS_DIR: /data/documents
      LOG_LEVEL: INFO
    volumes:
      - documents:/data/documents
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    command: ["python", "-m", "backend.app.jobs.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://alfa:alfa@db:5432/alfa_credit
      DEMO_MODE: "true"
      APP_ENV: local
      DOCUMENTS_DIR: /data/documents
      FIXTURES_ROOT: /app/fixtures
      JOB_MAX_ATTEMPTS: "3"
      JOB_LEASE_SECONDS: "60"
      WORKER_POLL_SECONDS: "2"
    volumes:
      - documents:/data/documents
      - ./fixtures:/app/fixtures:ro
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: caddy:2.8.4@sha256:226d1f059b75399fe19182893c7184591c07b97afc8dfcf44eeb80c9a77a530f
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  documents:
